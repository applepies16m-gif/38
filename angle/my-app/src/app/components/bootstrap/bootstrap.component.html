<div class="bootstrap-page">

  <div class="brand-bar">
    <img src="fabulari-logo-small.png" alt="Fabulari" class="brand-logo-img" />
    <span class="brand-tagline">first-time setup.</span>
  </div>

  <div class="bootstrap-wrap" role="main">
    <div class="panel bootstrap-box">
      <div class="panel-header" role="heading" aria-level="2">Create the Initial Super Admin</div>
      <div class="panel-body">

        <p class="helper-text">
          No accounts exist yet. Create the first Super Admin account
          to finish setting up Fabulari. This screen will not appear
          again once this account is created.
        </p>

        <form (ngSubmit)="onBootstrap()">

          <div class="field-row">
            <label for="bootstrap-firstname">First Name</label>
            <input id="bootstrap-firstname" type="text" [(ngModel)]="firstName" name="firstName" maxlength="50" />
          </div>

          <div class="field-row">
            <label for="bootstrap-lastname">Last Name</label>
            <input id="bootstrap-lastname" type="text" [(ngModel)]="lastName" name="lastName" maxlength="50" />
          </div>

          <div class="field-row">
            <label for="bootstrap-displayname">Display Name (optional)</label>
            <input id="bootstrap-displayname" type="text" [(ngModel)]="displayName" name="displayName" />
          </div>

          <div class="field-row">
            <label for="bootstrap-username">Username</label>
            <input id="bootstrap-username" type="text" [(ngModel)]="username" name="username" />
          </div>

          <div class="field-row">
            <label for="bootstrap-email">Email</label>
            <input id="bootstrap-email" type="text" [(ngModel)]="email" name="email" />
          </div>

          <div class="field-row">
            <label for="bootstrap-dateofbirth">Date of Birth</label>
            <input id="bootstrap-dateofbirth" type="date" [(ngModel)]="dateOfBirth" name="dateOfBirth" />
          </div>

          <div class="field-row">
            <label for="bootstrap-password">Password</label>
            <input id="bootstrap-password" type="password" [(ngModel)]="password" name="password" />
            <span class="hint-inline">min 8 characters, 1 uppercase letter</span>
          </div>

          <div class="field-row">
            <label for="bootstrap-confirmpassword">Confirm Password</label>
            <input id="bootstrap-confirmpassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" />
          </div>

          <div *ngIf="errorMsg" class="error-msg" role="alert">{{ errorMsg }}</div>

          <button type="submit" class="btn btn-primary bootstrap-btn">Create Super Admin</button>
        </form>
      </div>
    </div>
  </div>

</div>
