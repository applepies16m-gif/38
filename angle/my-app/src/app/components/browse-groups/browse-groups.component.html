<div class="browse-page">

  <div class="top-bar">
    <img src="fabulari-logo.png" alt="Fabulari" class="brand-logo-img" />
    <span class="browse-title">Browse Groups</span>
    <a routerLink="/chat" class="back-link">&larr; Back to Chat</a>
  </div>

  <div class="browse-body">

    <div class="panel">
      <div class="panel-body search-row">
        <input type="text" placeholder="Search groups by name..." [(ngModel)]="searchTerm" />
      </div>
    </div>

    <div *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</div>

    <div class="panel" *ngFor="let g of filteredGroups">
      <div class="panel-header">{{ g.title }}</div>
      <div class="panel-body group-row" *ngIf="joinStatus(g) as status">
        <div class="group-info">
          <p class="group-desc">{{ g.description }}</p>
          <span class="group-meta" *ngIf="g.ageLimit > 0">Age limit: {{ g.ageLimit }}+</span>
          <p class="group-meta" *ngIf="status.reason">{{ status.reason }}</p>
        </div>
        <button
          class="btn btn-primary"
          [disabled]="!status.canRequest"
          (click)="requestToJoin(g)"
        >
          {{ status.label }}
        </button>
      </div>
    </div>

    <p class="empty-text" *ngIf="filteredGroups.length === 0">No groups match your search.</p>

  </div>
</div>
